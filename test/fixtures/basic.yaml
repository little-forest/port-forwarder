global:
  check_interval: 30
  connect_timeout: 10
  retry_initial: 5
  retry_max: 300

entries:
  db-prod:
    description: production db tunnel
    host: bastion.example.com
    user: komori
    port: 22
    local_port: 15432
    remote_host: db.internal
    remote_port: 5432
    bind_address: 127.0.0.1
    enabled: true
    check_mode: remote

  redis-stg:
    host: stg-bastion.example.com
    user: komori
    local_port: 16379
    remote_host: redis.internal
    remote_port: 6379

  metrics:
    host: bastion.example.com
    local_port: 19090
    remote_host: prom.internal
    remote_port: 9090
    ssh_options:
      - ExitOnForwardFailure=yes
      - Compression=yes
