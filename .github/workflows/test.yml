---
name: Test

# Manual execution only for now; no automatic triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs every tool declared in aqua.yaml (task, bats, shellcheck, yq)
      - uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Run shellcheck
        run: task lint

      - name: Run unit tests
        run: task test
